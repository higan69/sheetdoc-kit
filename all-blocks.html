<!-- SheetDoc CMS v1.0 -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SheetDoc CMS</title>
<style>
/* ===== テーマ（CONFIG の theme で切り替え。変数のセットだけが変わり、仕組みは共通） ===== */
:root{
  --accent:#2e4a73;        /* アクセントカラー（藍） */
  --accent-ink:#ffffff;    /* アクセント色の上に乗る文字色 */
  --ink:#22201d;           /* 文字色 */
  --muted:#6d675c;         /* 補足テキスト色 */
  --line:#e2ddd2;          /* 罫線色 */
  --paper:#faf8f4;         /* 背景色 */
  --card:#ffffff;          /* カード背景 */
  --header-bg:#ffffff;     /* ヘッダー背景 */
  --th-bg:#f3efe5;         /* 表の見出し背景 */
  --today-bg:#fdf3d3;      /* 本日ハイライト背景 */
  --badge-bg:#2e4a73;      /* バッジ背景（アクセントと同色に統一） */
  --badge-ink:#ffffff;     /* バッジ文字色 */
  --radius:10px;
}
[data-theme="dark"]{
  --accent:#ffb340;
  --accent-ink:#241a05;
  --ink:#ece9e2;
  --muted:#a9b2ba;
  --line:#343a41;
  --paper:#131518;
  --card:#1d2025;
  --header-bg:#191c20;
  --th-bg:#2a2e35;
  --today-bg:#3a3010;
  --badge-bg:#ffb340;
  --badge-ink:#241a05;
}
[data-theme="wa"]{
  --accent:#a63d2d;
  --accent-ink:#ffffff;
  --ink:#2e2a24;
  --muted:#7c7260;
  --line:#ddd2ba;
  --paper:#f6f1e6;
  --card:#fffdf7;
  --header-bg:#fffaf0;
  --th-bg:#efe6cf;
  --today-bg:#f5ead2;
  --badge-bg:#a63d2d;
  --badge-ink:#ffffff;
  --radius:3px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.75}
header{background:var(--header-bg);border-bottom:1px solid var(--line);padding:30px max(18px,calc((100% - 960px)/2)) 26px}
header .site-title{font-size:clamp(26px,5vw,38px);font-weight:900;margin:0;line-height:1.3;letter-spacing:.02em}
header .site-title::after{content:'';display:block;width:52px;height:4px;background:var(--accent);border-radius:2px;margin-top:12px}
header .site-sub{color:var(--muted);font-size:14px;margin-top:6px}
main{max-width:960px;margin:26px auto;padding:0 14px 48px;display:grid;gap:24px}
.block{background:var(--card);border-radius:var(--radius);padding:22px 24px;box-shadow:0 1px 3px rgba(30,27,20,.06)}
.block>h2{font-size:19px;margin:0 0 14px;color:var(--ink);font-weight:800;line-height:1.4;border-left:5px solid var(--accent);padding-left:11px}
.block .loading{color:var(--muted);font-size:14px}
/* ドキュメント取り込み部（Google側のスタイルはJSでこの中だけに閉じ込めます） */
.gdoc{overflow-x:auto}
.gdoc .doc-content{padding:0!important;max-width:none!important}
.gdoc img{max-width:100%;height:auto}
[data-theme="dark"] .gdoc, [data-theme="dark"] .gdoc p, [data-theme="dark"] .gdoc span, [data-theme="dark"] .gdoc li, [data-theme="dark"] .gdoc td, [data-theme="dark"] .gdoc th,
[data-theme="dark"] .gdoc h1, [data-theme="dark"] .gdoc h2, [data-theme="dark"] .gdoc h3, [data-theme="dark"] .gdoc h4, [data-theme="dark"] .gdoc h5, [data-theme="dark"] .gdoc h6 { color: #ece9e2 !important; }
[data-theme="dark"] .gdoc a { color: #ffd08a !important; text-decoration: underline; }
/* 和テーマ：見出しだけ明朝にする */
[data-theme="wa"] header .site-title,
[data-theme="wa"] .block>h2,
[data-theme="wa"] .hero-title{font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho",serif;letter-spacing:.06em;font-weight:700}

/* 表ブロック（列が多い表はカード内で横スクロール） */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.sheet{border-collapse:collapse;width:100%;font-size:15px}
table.sheet th,table.sheet td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
table.sheet th{background:var(--th-bg);font-weight:800}
/* リストブロック */
.list-item{padding:10px 2px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .li-title{font-weight:800}
.list-item .li-body{font-size:14px;color:var(--muted);margin-top:3px;white-space:pre-wrap;line-height:1.7}
/* メニューブロック（点線リーダー＋価格右寄せ） */
.menu-item{display:flex;align-items:baseline;gap:8px;padding:7px 2px}
.menu-item .m-name{font-weight:700}
.menu-item .m-dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-3px)}
.menu-item .m-price{font-weight:800;color:var(--accent);white-space:nowrap}
.menu-desc{font-size:13px;color:var(--muted);padding:0 2px 8px}
/* 営業時間ブロック */
.hours-row{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px;border-bottom:1px solid var(--line);font-size:15px}
.hours-row:last-child{border-bottom:0}
.hours-row .h-day{font-weight:800;min-width:3.2em}
.hours-row .h-note{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
.hours-row.today{background:var(--today-bg);border-radius:6px}
.h-badge{background:var(--badge-bg);color:var(--badge-ink);font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px;margin-left:6px;vertical-align:2px}
/* ギャラリーブロック */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery figure{margin:0}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.gallery figcaption{font-size:13px;color:var(--muted);margin-top:4px;text-align:center}
/* 地図ブロック */
.map-frame{width:100%;height:320px;border:0;border-radius:8px}
.map-address{font-size:15px;margin-top:8px}
.map-note{font-size:13px;color:var(--muted)}
/* 緊急バナー（ドキュメント連動。空なら出ない） */
.alert-block{background:#b91c1c;color:#fff;border-radius:var(--radius);padding:16px 20px;font-weight:700}
.alert-block .gdoc,.alert-block .gdoc *{color:#fff!important}
/* リンクボタンブロック */
.link-btns{display:flex;gap:10px;flex-wrap:wrap}

/* リンクボタン：狭い画面では縦積みにして回り込みやすく */
.link-btn{overflow-wrap:anywhere}
@media (max-width:560px){.link-btns{flex-direction:column;align-items:stretch}.link-btn{text-align:center}}

.link-btn{display:inline-block;padding:11px 22px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;text-decoration:none}
.link-btn:hover{opacity:.88}
/* ===== 映画サイト向け ===== */
/* ヒーロー（ポスター＋タイトル） */
.hero-block{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.hero-img{width:min(300px,80%);border-radius:6px;box-shadow:0 2px 10px rgba(30,27,20,.18)}
.hero-catch{color:var(--accent);font-weight:800}
.hero-title{font-size:clamp(28px,6vw,44px);font-weight:900;line-height:1.25}
.hero-date{font-weight:800;margin-top:6px}
.hero-badge{display:inline-block;background:var(--badge-bg);color:var(--badge-ink);font-weight:800;border-radius:8px;padding:4px 14px;margin-top:10px;font-size:13px}
@media(min-width:700px){.hero-block{flex-direction:row;text-align:left}.hero-img{width:260px;flex-shrink:0}}
/* 予告編（クリックで読み込む） */
.yt-facade{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;cursor:pointer}
.yt-facade img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.yt-facade iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:68px;height:48px;background:#ff0000;border-radius:12px}
.yt-play:after{content:'';position:absolute;top:50%;left:50%;transform:translate(-40%,-50%);border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent}
/* 上映情報 */
.scr-row{display:flex;flex-wrap:wrap;gap:4px 14px;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.scr-row.today{background:var(--today-bg);border-radius:6px}
.scr-date{font-weight:800;color:var(--accent);min-width:8.5em;font-variant-numeric:tabular-nums}
.scr-venue{font-weight:700}
.scr-note{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
.scr-none{color:var(--muted);font-size:14px;padding:6px 2px}
/* キャスト＆スタッフ */
.credit-item{padding:10px 2px;border-bottom:1px solid var(--line)}
.credit-item:last-child{border-bottom:0}
.cr-name{font-size:17px;font-weight:900}
.cr-role{color:var(--accent);font-weight:700;font-size:13px;margin-left:10px}
.cr-profile{font-size:14px;color:var(--muted);margin-top:3px;white-space:pre-wrap;line-height:1.7}
/* 推薦コメント */
.quote-item{margin:0 0 14px;padding:16px 18px;background:var(--th-bg);border-left:4px solid var(--accent);border-radius:0 10px 10px 0}
.quote-item:last-child{margin-bottom:0}
.quote-item p{margin:0;font-size:15px;font-weight:700}
.quote-item cite{display:block;margin-top:6px;font-style:normal;font-size:13px;color:var(--muted);text-align:right}
/* ライブハウスのイベント日程 */
.evt-row{display:flex;gap:14px;padding:12px 8px;border-bottom:1px solid var(--line)}
.evt-row:last-child{border-bottom:0}
.evt-row.today{background:var(--today-bg);border-radius:6px}
.evt-date{font-weight:900;color:var(--accent);min-width:7.5em;font-size:14px;font-variant-numeric:tabular-nums}
.evt-title{font-weight:900;font-size:16px}
.evt-acts{font-size:14px;margin-top:2px}
.evt-meta{font-size:13px;color:var(--muted);margin-top:3px}
.evt-note{font-size:13px;color:var(--muted);margin-top:2px}
.evt-month{font-weight:900;font-size:15px;margin:18px 8px 2px}
.evt-tail[hidden]{display:none}
.evt-more-btn{display:block;margin:14px auto 6px;padding:9px 28px;border-radius:10px;border:1.5px solid var(--accent);background:none;color:var(--accent);font-weight:800;font-size:14px;cursor:pointer}
.evt-link-btn{display:inline-block;margin-top:9px;padding:8px 20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14px;text-decoration:none}

.scr-row{font-size:15px}
.scr-time{font-weight:800}
.scr-note{font-size:13px}
.scr-row .evt-link-btn{margin-top:2px;padding:5px 14px;font-size:13px}



.evt-archive-btn{margin-top:22px}
.evt-archive{margin-top:4px}


/* スケジュール：読みやすさ調整（特に時間と料金を大きく太く） */
.evt-row{padding:15px 8px}
.evt-date{font-size:15px;line-height:1.45}
.evt-title{font-size:17px;line-height:1.45}
.evt-acts{font-size:15px;line-height:1.55;margin-top:3px}
.evt-time{font-size:15px;font-weight:800;color:var(--ink);margin-top:6px}
.evt-price{font-size:16px;font-weight:900;color:var(--accent);margin-top:2px}
.evt-note{font-size:13px;line-height:1.55;margin-top:4px}
.evt-month{font-size:16px}
@media (max-width:560px){.evt-row{flex-direction:column;gap:3px}.evt-date{min-width:0}}

/* ニュース */
.news-item{display:flex;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.news-item:last-child{border-bottom:0}
.news-date{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.news-item a{color:var(--ink);font-weight:700}
footer{max-width:960px;margin:0 auto;padding:0 18px 30px;color:var(--muted);font-size:13px}

/* ヒーローイメージ（CONFIG.heroImage を設定すると、ページ最上部に大きく表示） */
.hero-image{display:block;width:100%;height:auto;max-height:340px;object-fit:cover;border-radius:var(--radius);margin:0 auto 16px}
/* 番組表（コミュニティ放送向け：曜日タブ＋放送中ハイライト） */
.controls{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 14px}
.controls button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:9px 13px;cursor:pointer;font-weight:700}
.controls button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.programs{padding:4px 4px}
.item{display:grid;grid-template-columns:76px 1fr;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .time{font-weight:800;color:var(--accent);font-size:16px;font-variant-numeric:tabular-nums}
.item .name{font-weight:800;font-size:16px}
.item .detail{font-size:13px;color:var(--muted);margin-top:3px}
.item .music{color:var(--muted);font-weight:600}
.item.now{background:var(--today-bg);border-radius:8px;box-shadow:inset 0 0 0 2px var(--badge-bg)}
.now-badge{background:var(--badge-bg);color:var(--badge-ink);font-size:10px;font-weight:800;border-radius:8px;padding:1px 7px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.effective{display:inline-block;background:var(--today-bg);border:1px solid var(--accent);color:var(--ink);padding:3px 12px;font-weight:800;border-radius:3px;font-size:13px}
.effective:empty{display:none}
@media(min-width:760px){.programs{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}.item{align-content:start}}
@media(max-width:420px){.item{grid-template-columns:62px 1fr;gap:8px}.item .time{font-size:14px}}

/* 和テーマ：見出しだけ明朝にする */
[data-theme="wa"] header .site-title,
[data-theme="wa"] .block>h2,
[data-theme="wa"] .hero-title{font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho",serif;letter-spacing:.06em;font-weight:700}
/* ===== 試作用テーマ切替バー（本番では消して CONFIG.theme で固定） ===== */
#themeSwitcher{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:99;display:flex;gap:6px;align-items:center;background:#1d2025;color:#ece9e2;border:1px solid #343a41;border-radius:24px;padding:7px 10px;box-shadow:0 6px 22px rgba(0,0,0,.35);font-size:12px}
#themeSwitcher button{border:1px solid #9aa3ab;background:transparent;color:#ece9e2;border-radius:16px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer}
#themeSwitcher button.active{background:#ffb340;border-color:#ffb340;color:#241a05}

/* ヒーローイメージ（CONFIG.heroImage を設定すると、ページ最上部に大きく表示） */
.hero-image{display:block;width:100%;height:auto;max-height:340px;object-fit:cover;border-radius:var(--radius);margin:0 auto 16px}
</style>
</head>
<body>
<header>
  <h1 class="site-title" id="siteTitle"></h1>
  <div class="site-sub" id="siteSub"></div>
</header>
<main id="blocks"></main>
<footer>Powered by SheetDoc CMS（Google Sheets / Google Docs 連携）</footer>

<script>
/* ================================================================
   設定はここだけ。Google側で「ウェブに公開」したURLを貼ってください。
   url が空のブロックは表示されません。ブロックは配列の順に並びます。
   ================================================================ */
const CONFIG = {
  siteTitle: 'SheetDoc CMS 機能一覧',
  siteSub: '全ブロック表示確認用ページ（デモデータで動作します）',
  theme: 'standard',
  heroImage: 'https://picsum.photos/seed/sheetdoc-top/1200/420',
  blocks: [
    { type: 'alert', url: 'demo:doc:alert' },
    { type: 'doc', title: 'doc｜ドキュメント表示', url: 'demo:doc:guide' },
    { type: 'sheet-table', title: 'sheet-table｜表', url: 'demo:sheet:table' },
    { type: 'sheet-list', title: 'sheet-list｜一覧', url: 'demo:sheet:list' },
    { type: 'sheet-menu', title: 'sheet-menu｜品目と価格', url: 'demo:sheet:menu' },
    { type: 'sheet-hours', title: 'sheet-hours｜営業時間', url: 'demo:sheet:hours' },
    { type: 'sheet-gallery', title: 'sheet-gallery｜写真', url: 'demo:sheet:gallery' },
    { type: 'map', title: 'map｜場所', url: 'demo:sheet:map' },
    { type: 'links', title: 'links｜リンクボタン', items: [
      { label: '電話をかける', url: 'tel:098-000-0000' },
      { label: '公式サイト', url: 'https://example.com/' },
      { label: 'メールで問い合わせ', url: 'mailto:info@example.com' }
    ] },
    { type: 'sheet-links', title: 'sheet-links｜リンク（シート版）', url: 'demo:sheet:links' },
    { type: 'sheet-events', title: 'sheet-events｜イベント日程', url: 'demo:sheet:events' },
    { type: 'hero', image: 'https://picsum.photos/seed/umi-poster/600/900', catch: '消えゆく港町の、最後の夏。', title: '海の匂いのする街', date: '2026/12/19', dateLabel: '2026年12月19日（土）より 沖縄・桜坂劇場ほか全国順次公開' },
    { type: 'youtube', title: 'youtube｜予告編', videoId: 'aqz-KE-bpKQ' },
    { type: 'sheet-screenings', title: 'sheet-screenings｜上映情報', url: 'demo:sheet:screenings' },
    { type: 'sheet-credits', title: 'sheet-credits｜人', url: 'demo:sheet:credits' },
    { type: 'sheet-quotes', title: 'sheet-quotes｜推薦コメント', url: 'demo:sheet:quotes' },
    { type: 'sheet-news', title: 'sheet-news｜お知らせ一覧', url: 'demo:sheet:news' },
    { type: 'timetable', title: 'timetable｜番組表（拡張例）', url: 'demo:sheet:timetable' }
  ]

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  return lines.map(line => {
    const row = [];
    let insideQuote = false, cell = '';
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (insideQuote && line[i+1] === '"') { cell += '"'; i++; }
        else { insideQuote = !insideQuote; }
      } else if (c === ',' && !insideQuote) {
        row.push(cell.trim()); cell = '';
      } else {
        cell += c;
      }
    }
    row.push(cell.trim());
    return row;
  });
}

// ドキュメント側のスタイルシートを、取り込み先ブロックの中だけに効くよう書き換える
// （ブロックごとにスコープを分けるので、複数ドキュメントでもスタイルが衝突しません）
function scopeCss(cssText, scope) {
  const imports = [];
  const css = cssText.replace(/@import[^;]+;/g, m => { imports.push(m); return ''; });
  const rules = css.split('}').map(r => r.trim()).filter(Boolean).map(rule => {
    const i = rule.indexOf('{');
    if (i < 0) return '';
    const selectors = rule.slice(0, i).split(',').map(s => s.trim())
      .filter(s => s && !/^(html|body|:root)/.test(s));
    if (!selectors.length) return '';
    return selectors.map(s => scope + ' ' + s).join(',') + '{' + rule.slice(i + 1) + '}';
  }).filter(Boolean).join('\n');
  return imports.join('\n') + '\n' + rules;
}

// ドキュメント内の画像は Google 側の埋め込み制限で直接表示できないため、
// fetch で取得し直して blob URL に差し替える
async function fetchImageBlob(url, tries) {
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url);
      if (r.ok) { const b = await r.blob(); if (!b.type || b.type.indexOf('image/') === 0) return b; }
    } catch (e) { /* 少し待って再試行する */ }
    if (i < tries - 1) await new Promise(res => setTimeout(res, 600 * (i + 1)));
  }
  return null;
}
// ドキュメント本文中の「文字列のままのURL」をリンクにする（既にリンクになっている部分は触らない）
function linkifyUrls(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !/https?:\/\//.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
      if (node.parentElement && node.parentElement.closest('a, script, style')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const targets = [];
  while (walker.nextNode()) targets.push(walker.currentNode);
  targets.forEach(node => {
    const text = node.nodeValue;
    const frag = document.createDocumentFragment();
    const re = /https?:\/\/[^\s<>"'、。，．・「」『』【】〈〉（）！？]+/g;
    let last = 0, m, linked = false;
    while ((m = re.exec(text))) {
      let url = m[0];
      while (/[.,;:!?]$/.test(url)) url = url.slice(0, -1); // 文末の句読点はURLに含めない
      if (url.endsWith(')') && !url.includes('(')) url = url.slice(0, -1);
      if (!url) continue;
      frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const a = document.createElement('a');
      a.href = url;
      a.textContent = url;
      a.target = '_blank';
      a.rel = 'noopener';
      frag.appendChild(a);
      last = m.index + url.length;
      linked = true;
    }
    if (!linked) return;
    frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

async function fixDocImages(div) {
  const jobs = [];
  div.querySelectorAll('img').forEach(img => {
    const src = img.getAttribute('src') || '';
    if (!/^https:\/\/docs\.google\.com\//.test(src)) return;
    jobs.push((async () => {
      const b = await fetchImageBlob(src, 3);
      if (b) { img.src = URL.createObjectURL(b); return; }
      setTimeout(async () => {
        const retry = await fetchImageBlob(src, 2);
        if (retry) img.src = URL.createObjectURL(retry);
        else img.style.display = 'none'; // 取得できない画像は壊れたアイコンを残さない
      }, 2500);
    })());
  });
  await Promise.all(jobs);
}

async function renderDoc(block, section, index) {
  if (!block.url) throw new Error('URL未設定');
  let url = block.url;
  if (/\/pub$/.test(url)) url += '?embedded=true';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Doc取得エラー');
  const parsed = new DOMParser().parseFromString(await res.text(), 'text/html');
  const contents = parsed.querySelector('#contents') || parsed.querySelector('.doc-content');
  if (!contents) throw new Error('Doc解析エラー');
  if (!contents.textContent.trim()) throw new Error('内容なし'); // 空の文書は欄ごと出さない
  const scopeClass = 'gdoc-' + index;
  let css = '';
  parsed.querySelectorAll('style').forEach(s => { css += s.textContent + '\n'; });
  const styleEl = document.createElement('style');
  styleEl.textContent = scopeCss(css, '.' + scopeClass);
  document.head.appendChild(styleEl);
  const div = document.createElement('div');
  div.className = 'gdoc ' + scopeClass;
  div.innerHTML = contents.innerHTML;
  div.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  fixDocImages(div);
  linkifyUrls(div);
  section.appendChild(div);
}

async function fetchSheetRows(block) {
  if (!block.url) throw new Error('URL未設定');
  let url = block.url;
  if (/\/pub$/.test(url)) url += '?output=csv';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Sheet取得エラー');
  return parseCSV(await res.text());
}

async function renderSheetTable(block, section) {
  const rows = await fetchSheetRows(block);
  if (!rows.length) throw new Error('データなし');
  const [head, ...body] = rows;
  const html = '<div class="table-wrap"><table class="sheet"><thead><tr>' +
    head.map(c => '<th>' + escapeHtml(c) + '</th>').join('') +
    '</tr></thead><tbody>' +
    body.map(r => '<tr>' + head.map((_, i) => '<td>' + escapeHtml(r[i] || '') + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div>';
  section.insertAdjacentHTML('beforeend', html);
}

async function renderSheetList(block, section) {
  const rows = await fetchSheetRows(block);
  const items = rows.filter(r => r[0]);
  if (!items.length) throw new Error('データなし');
  section.insertAdjacentHTML('beforeend', items.map(r =>
    '<div class="list-item"><div class="li-title">' + escapeHtml(r[0]) + '</div>' +
    (r[1] ? '<div class="li-body">' + escapeHtml(r[1]) + '</div>' : '') + '</div>'
  ).join(''));
}

// 先頭行が「品名」「価格」のような見出し行だった場合は自動で読み飛ばす
// （編集する人が見出し行を足してしまっても壊れないようにするため）
function dropHeader(rows, colWords) {
  if (!rows.length) return rows;
  const first = rows[0].map(c => (c || '').trim());
  const looksHeader = colWords.some((words, i) => words.includes(first[i]));
  return looksHeader ? rows.slice(1) : rows;
}

      (r[2] ? '<span class="h-note">' + escapeHtml(r[2]) + '</span>' : '') + '</div>';

}

function toImageUrl(u) {
  const m = String(u).match(/drive\.google\.com\/file\/d\/([^/]+)/) || String(u).match(/[?&]id=([\w-]{20,})/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1000' : u;
}

// 日付セルの読み取り（2026/12/5、2026-12-05、12/5 に対応。読めなければ null）
function parseDateCell(s) {
  if (!s) return null;
  const str = String(s);
  let m = str.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = str.match(/(\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return new Date(new Date().getFullYear(), +m[1] - 1, +m[2]);
  return null;
}

function renderHero(block, section) {
  if (!block.image && !block.title) throw new Error('ヒーロー未設定');
  let badge = '';
  const d = parseDateCell(block.date);
  if (d) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((d - today) / 86400000);
    if (diff > 0) badge = '<span class="hero-badge">公開まであと' + diff + '日</span>';
    else if (diff === 0) badge = '<span class="hero-badge">本日公開！</span>';
  }
  section.innerHTML =
    (block.image ? '<img class="hero-img" src="' + escapeHtml(toImageUrl(block.image)) + '" alt="">' : '') +
    '<div class="hero-text">' +
    (block.catch ? '<div class="hero-catch">' + escapeHtml(block.catch) + '</div>' : '') +
    '<div class="hero-title">' + escapeHtml(block.title || '') + '</div>' +
    (block.dateLabel ? '<div class="hero-date">' + escapeHtml(block.dateLabel) + '</div>' : '') +
    badge + '</div>';
}

async function renderSheetScreenings(block, section) {
  const rows = dropHeader(await fetchSheetRows(block),
    [['日付', '上映日'], ['劇場', '会場', '上映館']]).filter(r => r[0]);
  if (!rows.length) throw new Error('データなし');
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const all = rows.map(r => ({ r, d: parseDateCell(r[0]) }));
  const items = all.filter(x => !x.d || x.d >= today) // 日付が読めない行は告知として残す
    .sort((a, b) => (a.d ? a.d.getTime() : Infinity) - (b.d ? b.d.getTime() : Infinity)); // 日付なし行は末尾
  const past = all.filter(x => x.d && x.d < today)
    .sort((a, b) => b.d.getTime() - a.d.getTime()); // 過去分は新しい順
  const W = ['日', '月', '火', '水', '木', '金', '土'];
  const rowHtml = ({ r, d }) => {
    const isToday = d && d.getTime() === today.getTime();
    const dateText = d ? (d.getMonth() + 1) + '月' + d.getDate() + '日（' + W[d.getDay()] + '）' : r[0];
    return '<div class="scr-row' + (isToday ? ' today' : '') + '">' +
      '<span class="scr-date">' + escapeHtml(dateText) + (isToday ? '<span class="h-badge">本日</span>' : '') + '</span>' +
      '<span class="scr-venue">' + escapeHtml(r[1] || '') + '</span>' +
      '<span class="scr-time">' + escapeHtml(r[2] || '') + '</span>' +
      (r[3] ? '<span class="scr-note">' + escapeHtml(r[3]) + '</span>' : '') +
      (r[4] && /^https?:\/\//.test(r[4].trim()) ? '<a class="evt-link-btn" href="' + escapeHtml(r[4].trim()) + '" target="_blank" rel="noopener">詳しく見る</a>' : '') + '</div>';
  };
  const monthLabel = d => d ? d.getFullYear() + '年' + (d.getMonth() + 1) + '月' : '日付未定';
  const groupedHtml = list => {
    let html = '', last = null;
    list.forEach(x => {
      const label = monthLabel(x.d);
      if (label !== last) { html += '<div class="evt-month">' + label + '</div>'; last = label; }
      html += rowHtml(x);
    });
    return html;
  };
  let html = '';
  if (items.length) {
    const INITIAL = 10; // 最初に表示する件数（残りは「もっと見る」で開く）
    const head = items.slice(0, INITIAL), tail = items.slice(INITIAL);
    html += groupedHtml(head);
    if (tail.length) {
      html += '<div class="evt-tail" hidden>' + groupedHtml(tail) + '</div>' +
        '<button type="button" class="evt-more-btn">もっと見る（残り' + tail.length + '件）</button>';
    }
  } else if (past.length) {
    html += '<div class="scr-none">現在予定されている上映はありません。</div>';
  } else {
    html += '<div class="scr-none">上映は終了しました。新しい上映情報は決まり次第お知らせします。</div>';
  }
  if (past.length) {
    const PAST_INITIAL = 20; // 過去分は最初に20件、残りは「もっと見る」で遡る
    const pHead = past.slice(0, PAST_INITIAL), pTail = past.slice(PAST_INITIAL);
    html += '<button type="button" class="evt-more-btn evt-archive-btn">過去の上映を見る（全' + past.length + '件）</button>' +
      '<div class="evt-archive" hidden>' + groupedHtml(pHead);
    if (pTail.length) {
      html += '<div class="evt-tail" hidden>' + groupedHtml(pTail) + '</div>' +
        '<button type="button" class="evt-more-btn">もっと見る（残り' + pTail.length + '件）</button>';
    }
    html += '</div>';
  }
  section.insertAdjacentHTML('beforeend', html);
  section.querySelectorAll('.evt-more-btn').forEach(btn => {
    if (btn.classList.contains('evt-archive-btn')) {
      btn.addEventListener('click', () => {
        const box = btn.nextElementSibling;
        box.hidden = !box.hidden;
        btn.textContent = box.hidden ? '過去の上映を見る（全' + past.length + '件）' : '過去の上映を閉じる';
      });
    } else {
      btn.addEventListener('click', () => {
        btn.previousElementSibling.hidden = false;
        btn.remove();
      });
    }
  });
}

async function renderTimetable(block, section) {
  const res = await fetch(block.url);
  if (!res.ok) throw new Error('Sheet取得エラー');
  const rows = parseCSV(await res.text());
  const labels = { mon: '月曜日', tue: '火曜日', wed: '水曜日', thu: '木曜日', fri: '金曜日', sat: '土曜日', sun: '日曜日' };
  const keys = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
  const schedule = { mon: [], tue: [], wed: [], thu: [], fri: [], sat: [], sun: [] };
  rows.slice(1).forEach(row => {
    const [type, dayKey, time, name, detail] = row;
    if (type === 'config' && dayKey === 'effective_date' && time) {
      const et = document.getElementById('effectiveText');
      if (et) et.textContent = time;
    } else if (type === 'schedule' && dayKey && schedule[dayKey]) {
      schedule[dayKey].push([time || '', name || '', detail || '']);
    }
  });
  const nav = document.createElement('nav');
  nav.className = 'controls';
  nav.setAttribute('aria-label', '曜日を選択');
  const todayKey = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'][new Date().getDay()];
  let currentDay = todayKey;
  const panel = document.createElement('div');
  panel.className = 'programs';
  function timeRange(str) {
    const m = String(str).match(/(\d{1,2}):(\d{2})/g);
    if (!m) return null;
    const toMin = t => { const [h, mi] = t.split(':').map(Number); return h * 60 + mi; };
    return { start: toMin(m[0]), end: m.length > 1 ? toMin(m[1]) : null };
  }
  function markNow(items) {
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    const ranges = items.map(([time]) => timeRange(time));
    for (let i = 0; i < items.length; i++) {
      const r = ranges[i];
      if (!r) continue;
      let end = (r.end !== null && r.end > r.start) ? r.end : null;
      if (end === null) {
        for (let j = i + 1; j < items.length; j++) { if (ranges[j]) { end = ranges[j].start; break; } }
      }
      if (end === null) end = 24 * 60;
      if (nowMin >= r.start && nowMin < end) {
        const el = panel.children[i];
        if (el) {
          el.classList.add('now');
          el.querySelector('.name')?.insertAdjacentHTML('beforeend', '<span class="now-badge">放送中</span>');
        }
        break;
      }
    }
  }
  function show(day) {
    currentDay = day;
    const items = schedule[day] || [];
    panel.innerHTML = items.length === 0
      ? '<div style="padding:20px;text-align:center;">番組データがありません</div>'
      : items.map(([time, name, detail]) =>
          '<article class="item"><div class="time">' + escapeHtml(time) + '</div><div><div class="name">' +
          (name.includes('Music') ? '<span class="music">' : '<span>') + escapeHtml(name) + '</span></div>' +
          (detail ? '<div class="detail">' + escapeHtml(detail) + '</div>' : '') + '</div></article>'
        ).join('');
    nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.day === day)));
    section.querySelector('h2').textContent = '番組表 — ' + labels[day];
    if (day === todayKey && items.length) markNow(items);
  }
  keys.forEach(k => {
    const b = document.createElement('button');
    b.dataset.day = k;
    b.textContent = labels[k].replace('曜日', '');
    b.setAttribute('aria-pressed', String(k === currentDay));
    b.addEventListener('click', () => show(k));
    nav.appendChild(b);
  });
  section.appendChild(nav);
  section.appendChild(panel);
  show(currentDay);
  setInterval(() => { if (currentDay === todayKey) show(currentDay); }, 60000);
}

async function loadBlocks() {
  const main = document.getElementById('blocks');
  for (let i = 0; i < CONFIG.blocks.length; i++) {
    const block = CONFIG.blocks[i];
    if (!RENDERERS[block.type]) continue;
    const section = document.createElement('section');
    if (block.type === 'hero') {
      section.className = 'hero-block'; // ヒーローはカード見出しなしで大きく出す
    } else if (block.type === 'alert') {
      section.className = 'alert-block'; // 緊急バナーも見出しなし
    } else {
      section.className = 'block';
      section.innerHTML = '<h2>' + escapeHtml(block.title || '') + '</h2><div class="loading">読み込み中...</div>';
    }
    main.appendChild(section);
    try {
      await RENDERERS[block.type](block, section, i);
      section.querySelector('.loading')?.remove();
    } catch (err) {
      console.error('ブロック読み込みエラー:', block.title, err);
      section.remove(); // 取得に失敗したブロックは表示しない
    }
  }
}

loadBlocks();
</script>
<script>
/* ===== 試作用テーマ切替バー（本番ではこのブロックごと削除し、CONFIG.theme で固定） ===== */
(function () {
  const bar = document.createElement('div');
  bar.id = 'themeSwitcher';
  bar.innerHTML = '<span>テーマ試作</span>' +
    [['standard', 'スタンダード'], ['dark', 'ダーク'], ['wa', '和モダン']].map(([v, label]) =>
      '<button type="button" data-t="' + v + '"' + (document.documentElement.dataset.theme === v ? ' class="active"' : '') + '>' + label + '</button>').join('');
  document.body.appendChild(bar);
  bar.addEventListener('click', e => {
    const b = e.target.closest('button[data-t]');
    if (!b) return;
    document.documentElement.dataset.theme = b.dataset.t;
    bar.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
  });
})();
</script>
</body>
</html>
